name: lightweight unit tests

on:
  push:
    paths:
      - "extended_study/*.py"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.4.5 scipy==1.17.1 scikit-learn==1.8.0 joblib==1.5.3 psutil==7.2.2
      - run: python -m unittest discover -s tests -v
