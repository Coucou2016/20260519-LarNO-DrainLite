default: &DEFAULT

  # LarNO-DrainAdapter: original 13-channel pretrained LarNO backbone plus
  # a separate drainage residual adapter trained on drainage labels.

  n_params_baseline: None
  verbose: True
  arch: 'tfno2d'

  distributed:
    use_distributed: False
    wireup_info: 'mpi'
    wireup_store: 'tcp'
    model_parallel_size: 2
    seed: 666

  tfno2d:
    data_channels: 13
    n_modes_height: 100
    n_modes_width: 140
    hidden_channels: 32
    projection_channel_ratio: 2
    n_layers: 4
    domain_padding: None
    domain_padding_mode: 'one-sided'
    fft_norm: 'forward'
    norm: 'group_norm'
    skip: 'linear'
    implementation: 'factorized'
    separable: 0
    preactivation: 0
    use_channel_mlp: 1
    channel_mlp_expansion: 0.5
    channel_mlp_dropout: 0
    factorization: None
    rank: 1.0
    fixed_rank_modes: None
    dropout: 0.0
    tensor_lasso_penalty: 0.0
    joint_factorization: False
    stabilizer: None
    wall_height: 50

  finetune:
    enabled: True
    pretrained_dir: "../../exp/20260220_183648_006352/weights/model_epoch_992_error@0.000055821"
    state_dict_name: "model_epoch_992_error@0.000055821_state_dict.pt"

  opt:
    n_epochs: 50
    learning_rate: 1e-3
    training_loss: 'WMSE'
    weight_decay: 1e-4
    amp_autocast: False
    T_max: 50
    lr_max: 1e-3
    lr_min: 1e-5

  data:
    batch_size: 1
    num_workers_train: 0
    num_workers_test: 0
    train_list: "region1_drainage_train.txt"
    test_list: "region1_drainage_test.txt"
    data_root: "../../benchmark/urbanflood/"
    exp_root: "../../exp"
    train_location: "region1_20m_drainage_v1"
    drainage_features: "drain_inlet_mask,drain_outfall_mask,pipe_mask,pipe_diameter,pipe_slope,pipe_capacity,pipe_cover_depth,distance_to_outfall"

  eval:
    flood_threshold: 0.03
    locations: "region1_20m_drainage_v1"

  patching:
    levels: 0
    padding: 0
    stitching: False
