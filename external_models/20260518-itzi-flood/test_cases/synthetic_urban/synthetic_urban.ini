[time]
duration = 02:00:00
record_step = 00:10:00

[input]
# Digital Elevation Model
dem = dem@PERMANENT
# Manning's n friction coefficient
friction = mannings@PERMANENT
# Starting water depth (none = dry start)
start_h =
# Rainfall in mm/h
rain = rainfall@PERMANENT
# Boundary conditions type (1=open)
bctype = bctype@PERMANENT
# Boundary conditions values
bcval = bcvalue@PERMANENT
# Infiltration (none = no infiltration loss)
infiltration =

[output]
# Prefix for output raster time series
prefix = itzi_synth_urban
# Output variables to save
values = h, wse, v, vdir, qx, qy, boundaries, rainfall

[statistics]
# CSV file for mass balance statistics
stats_file = itzi_synth_urban_stats.csv

[options]
# Minimum water depth threshold (m)
hmin = 0.001
# Maximum allowed slope (m/m)
slmax = 0.1
# CFL stability coefficient
cfl = 0.7
# Inertia weighting (0.9 = nearly full inertia)
theta = 0.9
# Rain routing velocity (m/s)
vrouting = 0.1
# Maximum time step (seconds)
dtmax = 1
# Infiltration time step (seconds) - not used for null infiltration
dtinf = 60

[drainage]
# SWMM input file - leave empty for surface-only simulation
swmm_inp =

[grass]
# Path to the GRASS binary (leave empty to use default grass)
grass_bin = E:\Tools\GRASS-GIS-8.4.2\grass_launcher.py
# Path to GRASS GIS database
grassdata = E:\Projects\20260518-itzi-flood\test_cases\synthetic_urban\grassdata
# Location name
location = synthetic_urban
# Mapset name
mapset = PERMANENT
# Region definition (leave empty for full extent)
region =
# Raster mask (leave empty for no mask)
mask =
